# Default simulation configuration
environment:
  bounds: [[0, 0, 0], [10, 10, 5]]  # [[xmin, ymin, zmin], [xmax, ymax, zmax]]
  dt: 0.05  # seconds

uav:
  max_speed: 2.0        # m/s
  max_acceleration: 3.0 # m/s^2
  max_jerk: 5.0         # m/s^3
  radius: 0.15          # collision radius, meters

scenario:
  n_obstacles: 5
  n_uavs: 1
  min_clearance: 0.5    # minimum clearance for start/target placement
  seed: 42

gym:
  obs_obstacle_count: 5  # K nearest obstacles in observation
  max_episode_steps: 500
  reward_weights:
    progress: 1.0
    clearance_bonus: 0.1
    reach_bonus: 100.0
    collision_penalty: -50.0
    jerk_penalty: -0.01

planner:
  max_iterations: 5000
  timeout_seconds: 30.0
  seed: 42

rrt_star:
  step_size: 0.3
  neighbor_radius: 0.8
  goal_bias: 0.1
  objective_weights:
    length: 1.0
    energy: 0.3
    smoothness: 0.2
    safety: -2.0

apf_pso:
  n_particles: 30
  n_waypoints: 15
  sensor_radius: 2.0
  k_att: 1.0
  k_rep: 2.0
  d0: 1.5
  w: 0.7
  c1: 1.5
  c2: 1.5

ppo:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  net_arch: [256, 256]

ddpg:
  learning_rate: 1.0e-3
  buffer_size: 1000000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  action_noise_sigma: 0.1
  net_arch: [400, 300]
